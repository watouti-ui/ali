# Target-role taxonomy and search config for the career agent Scout.
# Seeded from interview-prep and the Master Resume & Career Evidence Bank.
# Ali: review and adjust — this is a starting point, not a final answer.

markets:
  # Dublin/Ireland and London/England are co-primary markets (evidence bank v2.11).
  primary:
    - Dublin, Ireland
    - London, England
    - Remote (Ireland)
    - Remote (UK)
  secondary: []  # add other markets you'd consider (e.g. remote EU-wide)

role_families:
  - name: Technical Program Management
    titles:
      - Technical Program Manager
      - Senior Technical Program Manager
      - Principal Technical Program Manager
      - Lead Technical Program Manager
  - name: PMO Leadership
    titles:
      - Head of PMO
      - Director of PMO
      - PMO Lead
      - Global PMO Manager
  - name: Transformation
    titles:
      - Director of Transformation
      - Head of Transformation
      - Business Transformation Lead
      - Product & Technology Transformation Lead
  - name: Platform Consolidation / Product Operations
    titles:
      - Platform Program Manager
      - Product Operations Lead
      - Platform Consolidation Manager
      - Director of Product Operations

# Company ATS boards to poll. Each entry maps to a source adapter in
# career_agent/scout/sources/. Populate with real companies you're
# targeting — board tokens are usually visible in the company's careers
# page URL (e.g. jobs.lever.co/<token>, boards.greenhouse.io/<token>,
# jobs.ashbyhq.com/<token>).
boards:
  - source: ashby
    token: trainline  # real target -- Lead Technical Programme Manager application already in flight

  # Apify LinkedIn/Indeed searches. Actors chosen for cost-vs-proven
  # reliability -- see the comparison in career_agent/README.md.
  #
  # Locations are the co-primary markets at their widest usable form:
  # "Greater Dublin Area" and "Greater London" supersede the bare city
  # searches (Greater London genuinely reaches Reading and Bracknell),
  # and each market also gets a remote sweep, since bank Part 7 gives
  # full IE/UK/EU work rights with no sponsorship needed. On LinkedIn
  # remote is expressed in the keywords, because the actor's input has no
  # workplace filter -- LinkedIn removed it when it moved to AI search.
  #
  # Every entry is one actor run and spends real credits: limitPerSource
  # and limit cap that.

  # --- Technical programme management ---
  - source: apify   # Technical programme management, Greater Dublin
    actor: curious_coder/linkedin-jobs-scraper
    input:
      keywords: Technical Program Manager
      location: Greater Dublin Area, Ireland
      limitPerSource: 20
      scrapeCompany: false
  - source: apify   # Technical programme management, Greater Dublin
    actor: valig/indeed-jobs-scraper
    input:
      country: ie
      title: Program Manager
      location: Dublin
      limit: 20
  - source: apify   # Technical programme management, Greater London
    actor: curious_coder/linkedin-jobs-scraper
    input:
      keywords: Technical Program Manager
      location: Greater London, United Kingdom
      limitPerSource: 20
      scrapeCompany: false
  - source: apify   # Technical programme management, Greater London
    actor: valig/indeed-jobs-scraper
    input:
      country: uk
      title: Program Manager
      location: London
      limit: 20
  - source: apify   # Technical programme management, Ireland, remote
    actor: curious_coder/linkedin-jobs-scraper
    input:
      keywords: Technical Program Manager remote
      location: Ireland
      limitPerSource: 20
      scrapeCompany: false
  - source: apify   # Technical programme management, Ireland, remote
    actor: valig/indeed-jobs-scraper
    input:
      country: ie
      title: Program Manager
      location: Remote
      limit: 20
  - source: apify   # Technical programme management, UK, remote
    actor: curious_coder/linkedin-jobs-scraper
    input:
      keywords: Technical Program Manager remote
      location: United Kingdom
      limitPerSource: 20
      scrapeCompany: false
  - source: apify   # Technical programme management, UK, remote
    actor: valig/indeed-jobs-scraper
    input:
      country: uk
      title: Program Manager
      location: Remote
      limit: 20

