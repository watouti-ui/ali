# Target-role taxonomy and search config for the career agent Scout.
# Seeded from interview-prep and the Master Resume & Career Evidence Bank.
# Ali: review and adjust — this is a starting point, not a final answer.

markets:
  # Dublin/Ireland and London/England are co-primary markets (evidence bank v2.11).
  primary:
    - Dublin, Ireland
    - London, England
    - Remote (Ireland)
    - Remote (UK)
  secondary: []  # add other markets you'd consider (e.g. remote EU-wide)

role_families:
  - name: Technical Program Management
    titles:
      - Technical Program Manager
      - Senior Technical Program Manager
      - Principal Technical Program Manager
      - Lead Technical Program Manager
  - name: PMO Leadership
    titles:
      - Head of PMO
      - Director of PMO
      - PMO Lead
      - Global PMO Manager
  - name: Transformation
    titles:
      - Director of Transformation
      - Head of Transformation
      - Business Transformation Lead
      - Product & Technology Transformation Lead
  - name: Platform Consolidation / Product Operations
    titles:
      - Platform Program Manager
      - Product Operations Lead
      - Platform Consolidation Manager
      - Director of Product Operations

# Company ATS boards to poll. Each entry maps to a source adapter in
# career_agent/scout/sources/. Populate with real companies you're
# targeting — board tokens are usually visible in the company's careers
# page URL (e.g. jobs.lever.co/<token>, boards.greenhouse.io/<token>,
# jobs.ashbyhq.com/<token>).
boards:
  - source: ashby
    token: trainline  # real target -- Lead Technical Programme Manager application already in flight
  # Apify LinkedIn/Indeed searches. Chosen for cost-vs-proven-reliability,
  # not lowest sticker price alone -- see the comparison in career_agent/README.md.
  # Each run spends real Apify credits: limitPerSource/limit caps that cost.
  # --- Technical programme management ---
  - source: apify
    actor: curious_coder/linkedin-jobs-scraper  # 142k+ users, 4.59★ (140 ratings), $0.002/result
    input:
      keywords: Technical Program Manager
      location: Dublin, Ireland
      limitPerSource: 25
      scrapeCompany: false
  - source: apify
    actor: valig/indeed-jobs-scraper  # 26k+ users, 5.0★ (17 ratings), $0.0001/result
    input:
      country: ie
      title: Program Manager
      location: Dublin
      limit: 25
  # --- Product operations ---
  - source: apify
    actor: curious_coder/linkedin-jobs-scraper
    input:
      keywords: Product Operations
      location: Dublin, Ireland
      limitPerSource: 25
      scrapeCompany: false
  - source: apify
    actor: valig/indeed-jobs-scraper
    input:
      country: ie
      title: Product Operations
      location: Dublin
      limit: 25
  - source: apify
    actor: curious_coder/linkedin-jobs-scraper
    input:
      keywords: Product Operations
      location: London, United Kingdom
      limitPerSource: 25
      scrapeCompany: false
  # --- Delivery management ---
  # "Delivery Manager" spans a wide band, from single-team agile delivery
  # up to Head of Delivery. The negative signals in candidate_profile.yaml
  # pull the under-levelled ones down rather than filtering them here,
  # since a title alone cannot tell them apart.
  - source: apify
    actor: curious_coder/linkedin-jobs-scraper
    input:
      keywords: Delivery Manager
      location: Dublin, Ireland
      limitPerSource: 25
      scrapeCompany: false
  - source: apify
    actor: valig/indeed-jobs-scraper
    input:
      country: ie
      title: Delivery Manager
      location: Dublin
      limit: 25
  - source: apify
    actor: curious_coder/linkedin-jobs-scraper
    input:
      keywords: Delivery Manager
      location: London, United Kingdom
      limitPerSource: 25
      scrapeCompany: false
# add more as you confirm target companies/searches. ATS board tokens are
# usually visible in the company's careers page URL, e.g.:
#   boards.greenhouse.io/<token>  -> source: greenhouse, token: <token>
#   jobs.lever.co/<token>         -> source: lever, token: <token>
#   jobs.ashbyhq.com/<token>      -> source: ashby, token: <token>
# More Apify searches (e.g. London, other role families) follow the same
# source: apify / actor / input shape as above -- copy an entry and change
# keywords/location. Running the pipeline needs APIFY_API_TOKEN set in the
# environment (see career_agent/README.md).

# Stage 1 hard filters (spec section 4). Keep these conservative — false
# suppression is worse than a bit of noise in the shortlist.
hard_filters:
  exclude_title_keywords:
    - intern
    - internship
    - junior
  exclude_location_keywords: []  # e.g. locations with no viable remote/relocation path
