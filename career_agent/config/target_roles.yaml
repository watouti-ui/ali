  # --- Workday: the enterprise ATS, and the standard for the banks,
  # pharma and corporates that dominate the Dublin and London markets.
  #
  # Each tenant's data centre (wd1/wd3/wd5/wd12) is part of its hostname
  # and differs per employer, so it is configured, not derived. All six
  # tenants below were probed live -- a wrong site path returns HTTP 422.
  #
  # Workday tenants are global, so the location goes into searchText:
  # "program manager" alone returns 315 Mastercard jobs led by New York,
  # Pune and Sao Paulo, while "program manager Dublin" returns 19 and
  # leads with Dublin. Without it a small limit would fill with roles the
  # hard filters then discard.
  #
  # The list carries no description, so detail_limit caps how many get a
  # second request for one.
  - source: workday
    token: mastercard
    site: CorporateCareers
    dc: wd1
    search_text: program manager Dublin
    limit: 12
    detail_limit: 6
  - source: workday
    token: mastercard
    site: CorporateCareers
    dc: wd1
    search_text: program manager London
    limit: 12
    detail_limit: 6
  - source: workday
    token: mastercard
    site: CorporateCareers
    dc: wd1
    search_text: product operations Dublin
    limit: 12
    detail_limit: 6
  - source: workday
    token: mastercard
    site: CorporateCareers
    dc: wd1
