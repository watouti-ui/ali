  # --- SmartRecruiters: the company identifier is case-sensitive and is
  # the one in the employer's careers URL. A wrong token returns 200 with
  # an empty list, indistinguishable from an employer with no vacancies,
  # so confirm a new token gives a non-zero totalFound before relying on
  # it. Seeded with the one verified board; add real target employers.
  - source: smartrecruiters
    token: SmartRecruiters
    limit: 30
    detail_limit: 10

# Stage 1 hard filters (spec section 4). Keep these conservative — false
# suppression is worse than a bit of noise in the shortlist.
hard_filters:
  exclude_title_keywords:
    - intern
    - internship
    - junior
  exclude_location_keywords: []  # e.g. locations with no viable remote/relocation path
